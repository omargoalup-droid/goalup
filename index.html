function isDemo(){return !REMOTE}
function isAdmin(){return !!state.profile&&state.profile.role==='admin'}
function currentUser(){return state.profile||null}

function demoLoad(){state.users=safeRead(KEYS.demo_users,[]);state.matches=safeRead(KEYS.demo_matches,[]);state.bookings=safeRead(KEYS.demo_bookings,[]);state.session=safeRead('goalup_demo_session',null);state.users.forEach(u=>u.credits=Number(u.credits)||0)}
function demoPersist(){safeWrite(KEYS.demo_users,state.users);safeWrite(KEYS.demo_matches,state.matches);safeWrite(KEYS.demo_bookings,state.bookings);safeWrite('goalup_demo_session',state.session)}

async function remoteLoad(){
  const {data:{session}}=await sb.auth.getSession(); state.session=session;
  const {data:publicMatches,error:me}=await sb.from('matches').select('*').order('date',{ascending:true}).order('time',{ascending:true});
  if(me) throw me; state.matches=(publicMatches||[]).map(normalizeMatch);
  if(!session){state.profile=null;state.users=[];state.bookings=[];return}
  await refreshRemote();
}
async function refreshRemote(){
  const {data:profile,error:pe}=await sb.from('profiles').select('*').eq('id',state.session.user.id).maybeSingle();
  if(pe) throw pe; state.profile=profile;
  const [ms,us,bs]=await Promise.all([
    sb.from('matches').select('*').order('date',{ascending:true}).order('time',{ascending:true}),
    isAdmin()?sb.from('profiles').select('*').eq('role','player').order('name'):Promise.resolve({data:[],error:null}),
    isAdmin()?sb.from('bookings').select('*').order('created_at',{ascending:false}):sb.from('bookings').select('*').eq('user_id',state.session.user.id).order('created_at',{ascending:false})
  ]);
  if(ms.error)throw ms.error;if(us.error)throw us.error;if(bs.error)throw bs.error;
  state.matches=(ms.data||[]).map(normalizeMatch);state.users=(us.data||[]).map(normalizeUser);state.bookings=(bs.data||[]).map(normalizeBooking);
  if(!isAdmin()) state.users=[state.profile].filter(Boolean).map(normalizeUser);
}
function normalizeMatch(m){return {id:m.id,title:m.title,date:m.date,time:m.time,location:m.location,price:Number(m.price)||0,minPlayers:Number(m.min_players)||8,maxPlayers:Number(m.max_players)||12,notes:m.notes||'',createdAt:m.created_at}}
function normalizeUser(u){return {id:u.id,name:u.name||'',email:u.email||'',phone:u.phone||'',credits:Number(u.credits)||0,photo:u.photo_url||u.photo||'',role:u.role||'player'}}
function normalizeBooking(b){return {id:b.id,matchId:b.match_id,userId:b.user_id,status:b.status||'pending',paymentMethod:b.payment_method||'wave',createdAt:b.created_at,paidAt:b.paid_at}}
let realtimeChannel=null;
function setupRealtime(){if(!REMOTE||!sb)return;if(realtimeChannel){sb.removeChannel(realtimeChannel);realtimeChannel=null}realtimeChannel=sb.channel('goalup-live').on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>refreshRemote().then(render).catch(console.error)).on('postgres_changes',{event:'*',schema:'public',table:'bookings'},()=>refreshRemote().then(render).catch(console.error)).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>refreshRemote().then(render).catch(console.error)).subscribe()}

async function boot(){try{if(REMOTE){await remoteLoad();setupRealtime();sb.auth.onAuthStateChange(async (_e,s)=>{state.session=s;if(s){try{await refreshRemote()}catch(err){console.error(err);toast('Impossible de synchroniser les données.','error')}}else{state.profile=null;state.users=[];state.bookings=[]}state.loading=false;render()})}else{demoLoad();if(state.session){state.profile=state.session.type==='admin'?{id:'admin',name:'GOALUP Admin',email:ADMIN_EMAIL,credits:0,role:'admin'}:state.users.find(u=>u.id===state.session.userId)||null}state.loading=false}}catch(e){console.error(e);state.loading=false;toast('Erreur de chargement : '+(e.message||e),'error')}render()}

async function login(email,password){
  email=email.trim().toLowerCase();
  if(isDemo()){if(email===ADMIN_EMAIL&&password===DEMO_ADMIN_PASSWORD){state.session={type:'admin'};state.profile={id:'admin',name:'GOALUP Admin',email:ADMIN_EMAIL,credits:0,role:'admin'};demoPersist();state.view='admin';render();return}const u=state.users.find(x=>x.email===email);if(!u||u.password!==password)throw new Error('Email ou mot de passe incorrect.');state.session={type:'user',userId:u.id};state.profile=u;demoPersist();state.view='home';render();return}
  const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;state.view='home';
}
async function register(name,email,password,photo){
  email=email.trim().toLowerCase();if(email===ADMIN_EMAIL)throw new Error('Cet email est réservé à l’administration.');
  if(isDemo()){if(state.users.some(x=>x.email===email))throw new Error('Un compte existe déjà avec cet email.');const u={id:uid('user'),name,email,password,phone:'',credits:0,photo:photo||'',role:'player'};state.users.push(u);state.profile=u;state.session={type:'user',userId:u.id};demoPersist();state.view='home';render();return}
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});if(error)throw error;if(data.user){if(photo)await sb.from('profiles').update({photo_url:photo}).eq('id',data.user.id);toast('Compte créé. Vérifie ton email si Supabase demande une confirmation.','success')}
}
function openAuth(mode='login'){document.getElementById('auth-modal')?.remove();document.body.insertAdjacentHTML('beforeend',authModal(mode))}
function closeModal(id){document.getElementById(id)?.remove()}
function authModal(mode){return `<div id="auth-modal" class="fixed inset-0 z-[100] modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4"><div class="w-full sm:max-w-md card rounded-b-none sm:rounded-3xl p-5 sm:p-7 max-h-[92vh] overflow-auto"><div class="flex justify-between items-center mb-6"><div><div class="text-red-400 text-xs font-black uppercase">GOALUP</div><h2 class="text-2xl font-black">${mode==='login'?'Connexion':'Créer mon compte'}</h2></div><button onclick="closeModal('auth-modal')" class="text-zinc-500 text-2xl">×</button></div><form onsubmit="submitAuth(event,'${mode}')" class="space-y-4">${mode==='register'?`<label class="block text-sm font-semibold">Nom complet<input name="name" class="input mt-2" required maxlength="80"></label>`:''}<label class="block text-sm font-semibold">Email<input name="email" type="email" class="input mt-2" required></label><label class="block text-sm font-semibold">Mot de passe<input name="password" type="password" class="input mt-2" minlength="6" required></label>${mode==='register'?`<label class="block text-sm font-semibold">Photo de profil <span class="text-zinc-600 font-normal">(facultative)</span><input name="photo" type="file" accept="image/*" class="input mt-2"></label>`:''}<button class="btn btn-red w-full">${mode==='login'?'Se connecter':'Créer mon compte'}</button></form><button onclick="openAuth('${mode==='login'?'register':'login'}')" class="w-full mt-4 text-sm text-zinc-400 hover:text-white">${mode==='login'?'Pas encore de compte ? Créer un compte':'Déjà un compte ? Se connecter'}</button></div></div>`}
async function submitAuth(e,mode){e.preventDefault();const f=e.target;try{let photo='';if(f.photo?.files?.[0])photo=await fileToDataURL(f.photo.files[0]);if(mode==='login')await login(f.email.value,f.password.value);else await register(f.name.value.trim(),f.email.value,f.password.value,photo);closeModal('auth-modal');if(!REMOTE)toast('Connexion réussie.','success');else{await new Promise(r=>setTimeout(r,300));await refreshRemote();render()}}catch(err){console.error(err);toast(err.message||'Erreur','error')}}
async function logout(){if(REMOTE)await sb.auth.signOut();else{state.session=null;state.profile=null;demoPersist()}state.view='home';render();toast('Déconnexion réussie.','success')}

function layout(content){const u=currentUser();return `<div class="min-h-screen"><header class="site-header sticky top-0 z-40 border-b"><div class="header-inner max-w-6xl mx-auto px-3 sm:px-4 flex items-center justify-between gap-2"><button onclick="go('home')" class="header-logo shrink-0" aria-label="GOALUP">${logoMarkup()}</button><div class="header-actions">${u?`${avatarMarkup(u,34)}<button onclick="go('profile')" class="hidden sm:block text-left min-w-0"><div class="text-sm font-bold truncate max-w-[180px]">${esc(u.name)}</div><div class="text-[11px] text-zinc-500">${isAdmin()?'Administrateur':'Joueur · '+money(u.credits||0)}</div></button>`:`<button onclick="openAuth('login')" class="btn btn-ghost header-btn">Connexion</button><button onclick="openAuth('register')" class="btn btn-red header-btn header-create">Créer un compte</button>`}</div></div></header><main class="max-w-6xl mx-auto px-4 py-6 safe-bottom">${content}</main>${u?navBar():''}</div>`}
function navBar(){const a=isAdmin()?[['home','⌂','Accueil'],['admin','▦','Admin'],['profile','◉','Profil']]:[['home','⌂','Matchs'],['reservations','✓','Réservations'],['profile','◉','Profil']];return `<nav class="mobile-nav fixed bottom-0 left-0 right-0 z-50 border-t border-[#171717] bg-black px-3 pt-2 pb-[calc(8px+env(safe-area-inset-bottom))]"><div class="max-w-lg mx-auto grid grid-cols-${a.length} gap-1">${a.map(x=>`<button onclick="go('${x[0]}')" class="nav-item ${state.view===x[0]?'active':''} text-zinc-500 flex flex-col items-center gap-0.5 text-[10px] font-bold"><span class="nav-icon text-base">${x[1]}</span>${x[2]}</button>`).join('')}</div></nav>`}
function render(){const app=document.getElementById('app');if(state.loading){app.innerHTML=layout(`<div class="min-h-[60vh] grid place-items-center"><div class="text-center"><div class="text-2xl font-black">GOALUP</div><p class="text-zinc-500 mt-2">Chargement…</p></div></div>`);return}let c=state.view==='home'?homeView():state.view==='reservations'?reservationsView():state.view==='profile'?profileView():state.view==='admin'&&isAdmin()?adminView():homeView();app.innerHTML=layout(c)}
function go(v){if(v==='admin'&&!isAdmin())return toast('Accès administrateur requis.','error');state.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}

function homeView(){const matches=[...state.matches].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<section><div class="rounded-[28px] overflow-hidden border border-white/5 bg-gradient-to-br from-red-950/45 via-[#111214] to-[#090909] p-6 sm:p-10 mb-7"><div class="max-w-2xl"><span class="badge bg-red-500/15 text-red-300 border border-red-500/20">⚽ DAKAR · FOOTBALL</span><h1 class="mt-4 text-4xl sm:text-6xl font-black tracking-tight leading-[.95]">Ton prochain<br><span class="text-red-500">match commence ici.</span></h1><p class="mt-4 text-zinc-400 max-w-xl">Réserve ta place, rejoins des joueurs à Dakar et joue. Simple, organisé, sans prise de tête.</p>${!currentUser()?`<div class="mt-6 flex flex-wrap gap-3"><button onclick="openAuth('register')" class="btn btn-red">Créer mon compte</button><button onclick="openAuth('login')" class="btn btn-ghost">J'ai déjà un compte</button></div>`:''}${isDemo()?`<div class="mt-5 rounded-2xl border border-amber-500/20 bg-amber-500/5 p-3 text-xs text-amber-200">Mode test local : configure Supabase dans le code pour partager les données entre appareils.</div>`:''}</div></div><div class="flex items-end justify-between mb-4"><div><p class="text-zinc-500 text-sm">Programme</p><h2 class="text-2xl font-black">Matchs disponibles</h2></div>${isAdmin()?`<button onclick="openMatchModal()" class="btn btn-red text-sm">＋ Nouveau match</button>`:''}</div>${matches.length?`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${matches.map(matchCard).join('')}</div>`:`<div class="card p-10 text-center"><div class="text-4xl mb-3">⚽</div><h3 class="font-bold text-lg">Aucun match pour le moment</h3><p class="text-sm text-zinc-500 mt-1">${isAdmin()?'Crée ton premier match depuis le dashboard administrateur.':'Les prochains matchs seront affichés ici dès qu’ils seront publiés.'}</p>${isAdmin()?`<button onclick="openMatchModal()" class="btn btn-red mt-5">Créer un match</button>`:''}</div>`}</section>`}
function matchCard(m){const confirmed=state.bookings.filter(b=>b.matchId===m.id&&b.status==='confirmed').length;const u=currentUser();const mine=u&&!isAdmin()&&state.bookings.some(b=>b.matchId===m.id&&b.userId===u.id&&['confirmed','pending'].includes(b.status));const max=Math.max(1,Number(m.maxPlayers)||1);const min=Math.min(max,Math.max(1,Number(m.minPlayers)||1));const full=confirmed>=max;const pct=Math.min(100,Math.round(confirmed/max*100));const minReached=confirmed>=min;const almost=!full&&pct>=75;const bar=full?'bg-emerald-500':almost?'bg-amber-400':minReached?'bg-red-500':'bg-zinc-600';const st=full?'bg-emerald-500/15 text-emerald-300':almost?'bg-amber-500/15 text-amber-300':minReached?'bg-red-500/15 text-red-300':'bg-white/5 text-zinc-400';const label=full?'Complet':almost?'Presque complet':minReached?'Minimum atteint':'En attente';return `<article class="card overflow-hidden"><div class="match-cover h-32 p-4 flex items-end justify-between"><div><div class="text-xs text-zinc-400 uppercase tracking-wider">${esc(m.location)}</div><div class="font-black text-xl">${esc(m.title)}</div></div><span class="badge bg-white/10">${confirmed}/${max}</span></div><div class="p-4"><div class="flex gap-2 flex-wrap text-sm"><span class="badge bg-white/5">📅 ${esc(fmtDate(m.date))}</span><span class="badge bg-white/5">🕒 ${esc(m.time)}</span></div><div class="mt-4"><div class="flex items-center justify-between gap-3 mb-2"><div class="flex items-center gap-2"><span class="text-sm font-black">${confirmed}/${max} joueurs</span><span class="badge ${st}">${label}</span></div><span class="text-xs text-zinc-500">Minimum ${min}</span></div><div class="h-2.5 rounded-full bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${bar}" style="width:${pct}%"></div></div></div>${m.notes?`<p class="text-sm text-zinc-500 mt-3">${esc(m.notes)}</p>`:''}<div class="mt-4 flex items-center justify-between gap-3"><div><div class="text-xl font-black">${money(m.price)}</div><div class="text-xs text-zinc-500">par joueur</div></div>${isAdmin()?`<div class="flex gap-2"><button onclick="openMatchModal('${m.id}')" class="btn btn-ghost text-xs">Modifier</button><button onclick="openRosterModal('${m.id}')" class="btn btn-ghost text-xs">Joueurs</button><button onclick="deleteMatch('${m.id}')" class="btn btn-danger text-xs">Suppr.</button></div>`:`<button onclick="reserve('${m.id}')" class="btn ${mine||full?'btn-ghost':'btn-red'} text-sm" ${mine||full?'disabled':''}>${mine?'Déjà réservé':full?'Complet':'Réserver'}</button>`}</div></div></article>`}

function reservationsView(){const u=currentUser();if(!u||isAdmin())return homeView();const list=state.bookings.filter(b=>b.userId===u.id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return `<section><div class="mb-6"><p class="text-zinc-500 text-sm">Mon espace</p><h1 class="text-3xl font-black">Mes réservations</h1><div class="mt-3 inline-flex badge bg-red-500/10 text-red-300">Crédit disponible · ${money(u.credits||0)}</div></div>${list.length?`<div class="space-y-3">${list.map(b=>{const m=state.matches.find(x=>x.id===b.matchId);if(!m)return '';return `<div class="card p-4 flex items-center justify-between gap-3"><div><div class="font-bold">${esc(m.title)}</div><div class="text-sm text-zinc-500">${esc(fmtDate(m.date))} · ${esc(m.time)} · ${esc(m.location)}</div><span class="badge mt-2 ${b.status==='confirmed'?'bg-emerald-500/15 text-emerald-300':'bg-amber-500/15 text-amber-300'}">${b.status==='confirmed'?'Réservation confirmée':'Paiement en attente'}</span></div><div class="text-right"><div class="font-black">${money(m.price)}</div>${b.status==='pending'?`<button onclick="continuePayment('${b.id}')" class="btn btn-red text-xs mt-2">Payer</button>`:`<button onclick="cancelBooking('${b.id}')" class="btn btn-ghost text-xs mt-2">Annuler</button>`}</div></div>`}).join('')}</div>`:`<div class="card p-10 text-center text-zinc-500">Tu n’as encore aucune réservation.</div>`}</section>`}

function adminView(){const confirmed=state.bookings.filter(b=>b.status==='confirmed').length,pending=state.bookings.filter(b=>b.status==='pending').length,total=state.users.reduce((s,u)=>s+(Number(u.credits)||0),0);return `<section><div class="flex flex-wrap gap-3 items-end justify-between mb-6"><div><p class="text-zinc-500 text-sm">Administration</p><h1 class="text-3xl font-black">Dashboard GOALUP</h1><p class="text-xs text-zinc-600 mt-1">${isDemo()?'Mode test local — les données ne sont pas partagées entre appareils.':'Données synchronisées avec Supabase.'}</p></div><div class="flex gap-2"><button onclick="openMatchModal()" class="btn btn-red">＋ Match</button></div></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"><div class="card p-4"><div class="text-zinc-500 text-xs">Matchs</div><div class="text-2xl font-black">${state.matches.length}</div></div><div class="card p-4"><div class="text-zinc-500 text-xs">Joueurs</div><div class="text-2xl font-black">${state.users.length}</div></div><div class="card p-4"><div class="text-zinc-500 text-xs">Réservations</div><div class="text-2xl font-black">${confirmed}</div><div class="text-[11px] text-zinc-500">${pending} en attente</div></div><div class="card p-4"><div class="text-zinc-500 text-xs">Crédits</div><div class="text-2xl font-black">${money(total)}</div></div></div><div class="grid lg:grid-cols-2 gap-5"><div class="card p-4"><div class="flex justify-between items-center mb-4"><div><h2 class="font-black text-lg">⚽ Matchs</h2><p class="text-xs text-zinc-500">Créer, modifier, supprimer et gérer les joueurs.</p></div><button onclick="openMatchModal()" class="btn btn-ghost text-xs">＋ Ajouter</button></div>${state.matches.length?`<div class="space-y-2">${state.matches.map(m=>{const n=state.bookings.filter(b=>b.matchId===m.id&&b.status==='confirmed').length;return `<div class="rounded-2xl bg-white/5 p-3"><div class="flex justify-between gap-3"><div class="min-w-0"><div class="font-bold truncate">${esc(m.title)}</div><div class="text-xs text-zinc-500">${esc(fmtDate(m.date))} · ${esc(m.time)} · ${esc(m.location)}</div><div class="mt-2 flex gap-1"><span class="badge bg-white/5">${n}/${m.maxPlayers}</span><span class="badge ${n>=m.maxPlayers?'bg-emerald-500/15 text-emerald-300':n>=m.minPlayers?'bg-red-500/15 text-red-300':'bg-white/5 text-zinc-400'}">Min ${m.minPlayers}</span></div></div><div class="flex gap-1 shrink-0"><button onclick="openMatchModal('${m.id}')" class="btn btn-ghost text-xs">Modifier</button><button onclick="openRosterModal('${m.id}')" class="btn btn-ghost text-xs">Joueurs</button><button onclick="deleteMatch('${m.id}')" class="btn btn-danger text-xs">Suppr.</button></div></div></div>`}).join('')}</div>`:`<div class="text-sm text-zinc-500 py-8 text-center">Aucun match créé.</div>`}</div><div class="card p-4"><div class="flex justify-between items-center mb-4"><div><h2 class="font-black text-lg">👤 Joueurs</h2><p class="text-xs text-zinc-500">Profils, crédits et réservations.</p></div><span class="badge bg-white/5">${state.users.length}</span></div>${state.users.length?`<div class="space-y-2 max-h-[650px] overflow-auto">${state.users.map(u=>{const nb=state.bookings.filter(b=>b.userId===u.id&&b.status==='confirmed').length;return `<div class="rounded-2xl bg-white/5 p-3 flex items-center gap-3">${avatarMarkup(u,42)}<div class="min-w-0 flex-1"><div class="font-bold truncate">${esc(u.name)}</div><div class="text-xs text-zinc-500 truncate">${esc(u.email)}</div><div class="flex gap-1 mt-1"><span class="badge bg-red-500/10 text-red-300">${money(u.credits||0)}</span><span class="badge bg-white/5 text-zinc-400">${nb} confirmé(s)</span></div></div><button onclick="openPlayerModal('${u.id}')" class="btn btn-ghost text-xs">Gérer</button></div>`}).join('')}</div>`:`<div class="text-sm text-zinc-500 py-8 text-center">Aucun joueur inscrit.</div>`}</div></div><div class="card p-4 mt-5"><div class="flex justify-between items-center mb-4"><div><h2 class="font-black text-lg">📋 Réservations</h2><p class="text-xs text-zinc-500">Confirmation et suppression.</p></div><button onclick="refreshData()" class="btn btn-ghost text-xs">Actualiser</button></div>${state.bookings.length?`<div class="space-y-2 max-h-[520px] overflow-auto">${state.bookings.map(b=>{const u=state.users.find(x=>x.id===b.userId),m=state.matches.find(x=>x.id===b.matchId);if(!u||!m)return '';return `<div class="rounded-2xl bg-white/5 p-3 flex flex-wrap items-center gap-3"><div class="flex items-center gap-3 min-w-0 flex-1">${avatarMarkup(u,38)}<div class="min-w-0"><div class="font-bold truncate">${esc(u.name)} · ${esc(m.title)}</div><div class="text-xs text-zinc-500">${esc(fmtDate(m.date))} · ${esc(m.time)} · ${money(m.price)}</div></div></div><span class="badge ${b.status==='confirmed'?'bg-emerald-500/15 text-emerald-300':'bg-amber-500/15 text-amber-300'}">${b.status}</span><div class="flex gap-2">${b.status==='pending'?`<button onclick="adminConfirmBooking('${b.id}')" class="btn btn-red text-xs">Confirmer</button>`:''}<button onclick="adminDeleteBooking('${b.id}')" class="btn btn-danger text-xs">Suppr.</button></div></div>`}).join('')}</div>`:`<div class="text-sm text-zinc-500 py-6 text-center">Aucune réservation.</div>`}</div></section>`}

function profileView(){const u=currentUser();if(!u)return homeView();return `<section class="max-w-2xl mx-auto"><div class="mb-6"><p class="text-zinc-500 text-sm">${isAdmin()?'Administration':'Mon espace'}</p><h1 class="text-3xl font-black">Profil</h1></div><div class="card p-5 sm:p-7"><div class="flex items-center gap-4 mb-7">${avatarMarkup(u,72)}<div><h2 class="text-xl font-black">${esc(u.name)}</h2><p class="text-sm text-zinc-500">${esc(u.email)}</p><span class="badge mt-2 bg-red-500/10 text-red-300">${isAdmin()?'ADMIN':'Crédit · '+money(u.credits||0)}</span></div></div>${!isAdmin()?`<form onsubmit="saveProfile(event)" class="space-y-4"><label class="block text-sm font-semibold">Nom complet<input name="name" class="input mt-2" value="${attr(u.name)}" required maxlength="80"></label><label class="block text-sm font-semibold">Téléphone<input name="phone" class="input mt-2" value="${attr(u.phone||'')}" maxlength="30"></label><label class="block text-sm font-semibold">Photo de profil<input name="photo" type="file" accept="image/*" class="input mt-2"></label><button class="btn btn-red w-full">Enregistrer</button></form>`:`<div class="rounded-2xl bg-white/5 p-4 text-sm text-zinc-400">Compte administrateur. Les joueurs, matchs, crédits et réservations sont gérés depuis le dashboard.</div>`}<button onclick="logout()" class="btn btn-ghost mt-5 w-full">Se déconnecter</button></div></section>`}

function openMatchModal(id=''){if(!isAdmin())return;const m=id?state.matches.find(x=>x.id===id):null;document.body.insertAdjacentHTML('beforeend',`<div id="match-modal" class="fixed inset-0 z-[100] modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4"><div class="w-full sm:max-w-lg card rounded-b-none sm:rounded-3xl p-5 sm:p-7 max-h-[94vh] overflow-auto"><div class="flex justify-between items-center mb-6"><div><p class="text-red-400 text-xs font-bold uppercase">ADMIN</p><h2 class="text-2xl font-black">${m?'Modifier le match':'Nouveau match'}</h2></div><button onclick="closeModal('match-modal')" class="text-zinc-500 text-2xl">×</button></div><form onsubmit="saveMatch(event,'${m?.id||''}')" class="space-y-4"><label class="block text-sm font-semibold">Nom du match<input name="title" class="input mt-2" required maxlength="80" value="${attr(m?.title||'')}"></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Date<input name="date" type="date" class="input mt-2" required value="${attr(m?.date||'')}"></label><label class="block text-sm font-semibold">Heure<input name="time" type="time" class="input mt-2" required value="${attr(m?.time||'')}"></label></div><label class="block text-sm font-semibold">Terrain / lieu<input name="location" class="input mt-2" required maxlength="120" value="${attr(m?.location||'')}"></label><div class="grid grid-cols-3 gap-3"><label class="block text-sm font-semibold">Prix FCFA<input name="price" type="number" min="0" step="100" class="input mt-2" required value="${m?.price??''}"></label><label class="block text-sm font-semibold">Minimum<input name="minPlayers" type="number" min="1" class="input mt-2" required value="${m?.minPlayers??8}"></label><label class="block text-sm font-semibold">Maximum<input name="maxPlayers" type="number" min="1" class="input mt-2" required value="${m?.maxPlayers??12}"></label></div><label class="block text-sm font-semibold">Notes<input name="notes" class="input mt-2" maxlength="200" value="${attr(m?.notes||'')}"></label><button class="btn btn-red w-full">${m?'Enregistrer':'Publier le match'}</button></form></div></div>`)}
async function saveMatch(e,id){e.preventDefault();if(!isAdmin())return;const f=e.target,max=Math.max(1,Number(f.maxPlayers.value)||1),min=Math.min(max,Math.max(1,Number(f.minPlayers.value)||1));const data={title:f.title.value.trim(),date:f.date.value,time:f.time.value,location:f.location.value.trim(),price:Math.max(0,Number(f.price.value)||0),min_players:min,max_players:max,notes:f.notes.value.trim()};try{if(REMOTE){let r;if(id)r=await sb.from('matches').update(data).eq('id',id);else r=await sb.from('matches').insert(data);if(r.error)throw r.error;await refreshRemote()}else{if(id)Object.assign(state.matches.find(x=>x.id===id),{...data,minPlayers:min,maxPlayers:max});else state.matches.push({id:uid('match'),...data,minPlayers:min,maxPlayers:max,createdAt:Date.now()});demoPersist()}closeModal('match-modal');render();toast(id?'Match mis à jour.':'Match publié.','success')}catch(err){toast(err.message||'Erreur lors de la sauvegarde.','error')}}
async function deleteMatch(id){if(!isAdmin())return;const m=state.matches.find(x=>x.id===id);if(!m||!confirm(`Supprimer « ${m.title} » et toutes ses réservations ?`))return;try{if(REMOTE){const r=await sb.from('matches').delete().eq('id',id);if(r.error)throw r.error;await refreshRemote()}else{state.matches=state.matches.filter(x=>x.id!==id);state.bookings=state.bookings.filter(b=>b.matchId!==id);demoPersist()}render();toast('Match supprimé.','success')}catch(err){toast(err.message||'Erreur','error')}}

function openRosterModal(matchId){if(!isAdmin())return;const m=state.matches.find(x=>x.id===matchId);if(!m)return;const booked=state.bookings.filter(b=>b.matchId===matchId&&['confirmed','pending'].includes(b.status));const bookedIds=new Set(booked.map(b=>b.userId));const available=state.users.filter(u=>!bookedIds.has(u.id));document.body.insertAdjacentHTML('beforeend',`<div id="roster-modal" class="fixed inset-0 z-[100] modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4"><div class="w-full sm:max-w-xl card rounded-b-none sm:rounded-3xl p-5 sm:p-7 max-h-[94vh] overflow-auto"><div class="flex justify-between items-start mb-5"><div><p class="text-red-400 text-xs font-black uppercase">ADMIN · MATCH</p><h2 class="text-2xl font-black">Joueurs du match</h2><p class="text-sm text-zinc-500 mt-1">${esc(m.title)} · ${booked.filter(b=>b.status==='confirmed').length}/${m.maxPlayers}</p></div><button onclick="closeModal('roster-modal')" class="text-zinc-500 text-2xl">×</button></div><div class="mb-6"><h3 class="font-black mb-3">Joueurs inscrits</h3>${booked.length?`<div class="space-y-2">${booked.map(b=>{const u=state.users.find(x=>x.id===b.userId);return u?`<div class="rounded-2xl bg-white/5 p-3 flex items-center gap-3">${avatarMarkup(u,40)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(u.name)}</div><div class="text-xs text-zinc-500">${esc(u.email)} · ${b.status}</div></div><button onclick="adminRemovePlayer('${matchId}','${u.id}')" class="btn btn-danger text-xs">Retirer</button></div>`:''}).join('')}</div>`:`<div class="text-sm text-zinc-500">Aucun joueur.</div>`}</div></div><div class="border-t border-white/10 pt-5"><h3 class="font-black mb-3">Ajouter un joueur</h3>${available.length?`<div class="space-y-2">${available.map(u=>`<div class="rounded-2xl bg-white/5 p-3 flex items-center gap-3">${avatarMarkup(u,40)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(u.name)}</div><div class="text-xs text-zinc-500">${esc(u.email)}</div></div><button onclick="adminAddPlayer('${matchId}','${u.id}')" class="btn btn-red text-xs">＋ Ajouter</button></div>`).join('')}</div>`:`<div class="text-sm text-zinc-500">Tous les joueurs sont déjà inscrits ou aucun compte joueur n'existe.</div>`}</div></div></div>`)}
async function adminAddPlayer(matchId,userId){if(!isAdmin())return;const m=state.matches.find(x=>x.id===matchId);if(!m)return;const count=state.bookings.filter(b=>b.matchId===matchId&&b.status==='confirmed').length;if(count>=m.maxPlayers)return toast('Le match est complet.','error');if(state.bookings.some(b=>b.matchId===matchId&&b.userId===userId&&['confirmed','pending'].includes(b.status)))return toast('Ce joueur est déjà inscrit.','error');try{if(REMOTE){const r=await sb.from('bookings').insert({match_id:matchId,user_id:userId,status:'confirmed',payment_method:'manual',paid_at:new Date().toISOString()});if(r.error)throw r.error;await refreshRemote()}else{state.bookings.push({id:uid('booking'),matchId,userId,status:'confirmed',paymentMethod:'manual',createdAt:Date.now(),paidAt:Date.now()});demoPersist()}closeModal('roster-modal');render();toast('Joueur ajouté au match.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function adminRemovePlayer(matchId,userId){if(!isAdmin())return;if(!confirm('Retirer ce joueur du match ?'))return;const b=state.bookings.find(x=>x.matchId===matchId&&x.userId===userId&&['confirmed','pending'].includes(x.status));if(!b)return;try{if(REMOTE){const r=await sb.rpc('admin_remove_player_from_match',{p_match_id:matchId,p_user_id:userId});if(r.error)throw r.error;await refreshRemote()}else{if(b.paymentMethod==='credits'){const u=state.users.find(x=>x.id===userId),m=state.matches.find(x=>x.id===matchId);if(u&&m)u.credits=(u.credits||0)+Number(m.price||0)}state.bookings=state.bookings.filter(x=>x.id!==b.id);demoPersist()}closeModal('roster-modal');render();toast('Joueur retiré du match.','success')}catch(err){toast(err.message||'Erreur','error')}}

function openPlayerModal(id){if(!isAdmin())return;const u=state.users.find(x=>x.id===id);if(!u)return;const bookings=state.bookings.filter(b=>b.userId===u.id);document.body.insertAdjacentHTML('beforeend',`<div id="player-modal" class="fixed inset-0 z-[100] modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4"><div class="w-full sm:max-w-xl card rounded-b-none sm:rounded-3xl p-5 sm:p-7 max-h-[95vh] overflow-auto"><div class="flex justify-between items-center mb-6"><div><p class="text-red-400 text-xs font-bold uppercase">ADMIN · JOUEUR</p><h2 class="text-2xl font-black">Gérer le joueur</h2></div><button onclick="closeModal('player-modal')" class="text-zinc-500 text-2xl">×</button></div><form onsubmit="savePlayer(event,'${u.id}')" class="space-y-4"><label class="block text-sm font-semibold">Nom<input name="name" class="input mt-2" required value="${attr(u.name)}"></label><label class="block text-sm font-semibold">Téléphone<input name="phone" class="input mt-2" value="${attr(u.phone||'')}"></label><div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold">Crédits<input name="credits" type="number" min="0" step="100" class="input mt-2" value="${u.credits||0}"></label><label class="block text-sm font-semibold">Variation<input name="delta" type="number" step="100" class="input mt-2" value="0"><span class="text-[11px] text-zinc-600">+5000 / -2000</span></label></div><label class="block text-sm font-semibold">Photo<input name="photo" type="file" accept="image/*" class="input mt-2"></label><button class="btn btn-red w-full">Enregistrer</button></form><div class="border-t border-white/10 mt-7 pt-6"><h3 class="font-black mb-3">Réservations</h3>${bookings.length?`<div class="space-y-2">${bookings.map(b=>{const m=state.matches.find(x=>x.id===b.matchId);return m?`<div class="rounded-2xl bg-white/5 p-3 flex justify-between"><div><b>${esc(m.title)}</b><div class="text-xs text-zinc-500">${fmtDate(m.date)} · ${m.time}</div></div><span class="badge">${b.status}</span></div>`:''}).join('')}</div>`:`<div class="text-sm text-zinc-500">Aucune réservation.</div>`}<button onclick="adminDeleteUser('${u.id}')" class="btn btn-danger w-full mt-5">Supprimer le joueur</button></div></div></div>`)}
async function savePlayer(e,id){e.preventDefault();if(!isAdmin())return;const f=e.target,u=state.users.find(x=>x.id===id);if(!u)return;let photo=u.photo||'';try{if(f.photo?.files?.[0])photo=await fileToDataURL(f.photo.files[0]);const credits=Math.max(0,Number(f.credits.value)||0)+Number(f.delta.value||0);const data={name:f.name.value.trim(),phone:f.phone.value.trim(),credits,photo_url:photo};if(REMOTE){const r=await sb.from('profiles').update(data).eq('id',id);if(r.error)throw r.error;await refreshRemote()}else{Object.assign(u,{name:data.name,phone:data.phone,credits,photo});demoPersist()}closeModal('player-modal');render();toast('Profil joueur mis à jour.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function adminDeleteUser(id){if(!isAdmin())return;const u=state.users.find(x=>x.id===id);if(!u||!confirm(`Supprimer ${u.name} et ses réservations ?`))return;try{if(REMOTE){const r=await sb.rpc('admin_delete_user',{p_user_id:id});if(r.error)throw r.error;await refreshRemote()}else{state.users=state.users.filter(x=>x.id!==id);state.bookings=state.bookings.filter(b=>b.userId!==id);demoPersist()}closeModal('player-modal');render();toast('Joueur supprimé.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function adminConfirmBooking(id){if(!isAdmin())return;try{if(REMOTE){const r=await sb.from('bookings').update({status:'confirmed',paid_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;await refreshRemote()}else{const b=state.bookings.find(x=>x.id===id);if(b)b.status='confirmed';demoPersist()}render();toast('Réservation confirmée.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function adminDeleteBooking(id){if(!isAdmin()||!confirm('Supprimer cette réservation ?'))return;try{if(REMOTE){const r=await sb.from('bookings').delete().eq('id',id);if(r.error)throw r.error;await refreshRemote()}else{state.bookings=state.bookings.filter(x=>x.id!==id);demoPersist()}render();toast('Réservation supprimée.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function refreshData(){try{if(REMOTE)await refreshRemote();else demoLoad();render();toast('Données actualisées.','success')}catch(err){toast(err.message||'Erreur de synchronisation','error')}}

async function reserve(matchId){const u=currentUser();if(!u||isAdmin())return openAuth('login');const m=state.matches.find(x=>x.id===matchId);if(!m)return;const confirmed=state.bookings.filter(b=>b.matchId===matchId&&b.status==='confirmed').length;if(confirmed>=m.maxPlayers)return toast('Ce match est complet.','error');if(state.bookings.some(b=>b.matchId===matchId&&b.userId===u.id&&['pending','confirmed'].includes(b.status)))return toast('Tu as déjà une réservation pour ce match.','info');try{if((u.credits||0)>=m.price){if(!confirm(`Utiliser ${money(m.price)} de ton crédit ?`))return;if(REMOTE){const r=await sb.rpc('reserve_with_credits',{p_match_id:matchId});if(r.error)throw r.error}else{u.credits-=m.price;state.bookings.push({id:uid('booking'),matchId,userId:u.id,status:'confirmed',paymentMethod:'credits',createdAt:Date.now(),paidAt:Date.now()});demoPersist()}if(REMOTE)await refreshRemote();render();return toast('Réservation confirmée avec tes crédits.','success')}const b=REMOTE?null:{id:uid('booking'),matchId,userId:u.id,status:'pending',paymentMethod:'wave',createdAt:Date.now()};if(REMOTE){const r=await sb.from('bookings').insert({match_id:matchId,user_id:u.id,status:'pending',payment_method:'wave'}).select().single();if(r.error)throw r.error;const nb=normalizeBooking(r.data);state.bookings.push(nb);window.location.href=WAVE_URL}else{state.bookings.push(b);demoPersist();if(confirm(`Prix : ${money(m.price)}\n\nOuvrir Wave pour payer ?`))window.location.href=WAVE_URL;else{state.view='reservations';render()}}}catch(err){toast(err.message||'Impossible de réserver.','error')}}
function continuePayment(id){window.location.href=WAVE_URL}
async function cancelBooking(id){const b=state.bookings.find(x=>x.id===id),m=b&&state.matches.find(x=>x.id===b.matchId);if(!b||!m)return;if(!confirm('Annuler cette réservation ?'))return;try{if(REMOTE){const r=await sb.rpc('cancel_booking',{p_booking_id:id});if(r.error)throw r.error;await refreshRemote()}else{if(b.paymentMethod==='credits'){const u=state.users.find(x=>x.id===b.userId);if(u)u.credits=(u.credits||0)+m.price}state.bookings=state.bookings.filter(x=>x.id!==id);demoPersist()}render();toast('Réservation annulée.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function saveProfile(e){e.preventDefault();const u=currentUser();if(!u||isAdmin())return;let photo=u.photo||'';try{if(e.target.photo?.files?.[0])photo=await fileToDataURL(e.target.photo.files[0]);const data={name:e.target.name.value.trim(),phone:e.target.phone.value.trim(),photo_url:photo};if(REMOTE){const r=await sb.from('profiles').update(data).eq('id',u.id);if(r.error)throw r.error;await refreshRemote()}else{Object.assign(u,{name:data.name,phone:data.phone,photo});state.profile=u;demoPersist()}render();toast('Profil mis à jour.','success')}catch(err){toast(err.message||'Erreur','error')}}
async function deleteOwnAccount(){const u=currentUser();if(!u||isAdmin()||!confirm('Supprimer définitivement ton compte ?'))return;try{if(REMOTE){const r=await sb.from('profiles').delete().eq('id',u.id);if(r.error)throw r.error;await sb.auth.signOut()}else{state.users=state.users.filter(x=>x.id!==u.id);state.bookings=state.bookings.filter(b=>b.userId!==u.id);state.session=null;state.profile=null;demoPersist()}state.view='home';render();toast('Compte supprimé.','success')}catch(err){toast(err.message||'Erreur','error')}}

window.go=go;window.openAuth=openAuth;window.closeModal=closeModal;window.submitAuth=submitAuth;window.logout=logout;window.openMatchModal=openMatchModal;window.saveMatch=saveMatch;window.deleteMatch=deleteMatch;window.openRosterModal=openRosterModal;window.adminAddPlayer=adminAddPlayer;window.adminRemovePlayer=adminRemovePlayer;window.openPlayerModal=openPlayerModal;window.savePlayer=savePlayer;window.adminDeleteUser=adminDeleteUser;window.adminConfirmBooking=adminConfirmBooking;window.adminDeleteBooking=adminDeleteBooking;window.refreshData=refreshData;window.reserve=reserve;window.continuePayment=continuePayment;window.cancelBooking=cancelBooking;window.saveProfile=saveProfile;window.deleteOwnAccount=deleteOwnAccount;
boot();
})();
</script>
</body></html>
