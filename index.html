<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOALUP — Application Officielle Dakar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        goalred: '#E50914',
                        goalDark: '#060608',
                        goalCard: '#111115',
                        goalCardHover: '#18181d',
                        goalBorder: '#22222b'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #060608; color: #f4f4f5; }
        input, select, textarea { color-scheme: dark; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-goalred selection:text-white">

    <!-- HEADER SÉCURISÉ -->
    <header class="sticky top-0 z-50 bg-[#060608]/95 backdrop-blur-md border-b border-goalBorder">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="app.navigateTo('matches')">
                <span class="text-xl font-black tracking-wider text-white">GOAL<span class="text-goalred">UP</span></span>
                <span class="text-[10px] uppercase font-bold tracking-widest text-zinc-500 border-l border-goalBorder pl-3 hidden sm:inline-block">Dakar</span>
            </div>
            
            <nav id="header-nav" class="hidden md:flex items-center space-x-8 text-sm font-semibold"></nav>
            <div id="header-user-area"></div>
        </div>
    </header>

    <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[#111115] border-t border-goalBorder flex justify-around py-3 px-2"></div>

    <main id="app-container" class="flex-grow pb-28 md:pb-16 pt-6 px-4 sm:px-6 max-w-6xl mx-auto w-full"></main>

    <!-- MODAL -->
    <div id="system-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-goalCard border border-goalBorder rounded-3xl w-full max-w-md p-6 sm:p-8 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="app.closeModal()" class="absolute top-5 right-5 text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="border-t border-goalBorder bg-[#060608] py-8 px-4 text-center text-xs text-zinc-500">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <span class="font-bold tracking-wider text-zinc-400">GOAL<span class="text-goalred">UP</span> SÉNÉGAL S.A.</span>
            <p>« Chaque match compte. » — Dakar, Sénégal</p>
            <span class="text-zinc-600">&copy; 2026 Tous droits réservés</span>
        </div>
    </footer>

    <script>
        class GoalUpApp {
            constructor() {
                this.state = {
                    currentView: 'matches',
                    params: {},
                    user: {
                        id: null,
                        firstName: "",
                        lastName: "",
                        email: "",
                        phone: "",
                        credits: 0,
                        avatar: "",
                        isAdmin: false,
                        isAuthenticated: false
                    },
                    matches: [
                        {
                            id: "m_01",
                            title: "GOALUP NIGHT - ALMADIES",
                            dateRaw: "2026-10-09",
                            dateFull: "Vendredi 9 Octobre 2026",
                            time: "21:00",
                            duration: "1h30",
                            location: "Terrain Galaxy Almadies",
                            address: "Route de Ngor, Dakar",
                            format: "7v7",
                            level: "Intermédiaire",
                            maxPlayers: 16,
                            minPlayers: 10,
                            currentPlayers: 1,
                            price: 3000,
                            status: "Ouvert",
                            description: "Match intense sur gazon synthétique de haute qualité. Chasubles et ballons fournis.",
                            organizer: { name: "Omar G.", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" },
                            registeredUsers: [],
                            messages: [],
                            welcomeMessages: {}
                        }
                    ],
                    playersDirectory: {
                        "usr_02": { id: "usr_02", firstName: "Mamadou", lastName: "Diallo", email: "mamadou@goalup.sn", phone: "+221 77 111 22 33", credits: 5000, position: "Attaquant", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" },
                        "usr_03": { id: "usr_03", firstName: "Cheikh", lastName: "Ndiaye", email: "cheikh@goalup.sn", phone: "+221 76 444 55 66", credits: 0, position: "Défenseur", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" }
                    }
                };
                this.navigateTo('matches');
            }

            navigateTo(view, params = {}) {
                this.state.currentView = view;
                this.state.params = params;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            render() {
                this.renderHeader();
                const container = document.getElementById('app-container');

                switch(this.state.currentView) {
                    case 'matches': container.innerHTML = this.renderMatchesView(); break;
                    case 'match-detail': container.innerHTML = this.renderMatchDetailView(this.state.params.matchId); break;
                    case 'messages': container.innerHTML = this.state.user.isAuthenticated ? this.renderMessagesView() : this.renderLoginPrompt(); break;
                    case 'game-chat': container.innerHTML = this.renderGameChatView(this.state.params.matchId); break;
                    case 'profile': container.innerHTML = this.state.user.isAuthenticated ? this.renderProfileView() : this.renderLoginPrompt(); break;
                    
                    // Vues Admin Sécurisées et Interactives
                    case 'admin-dashboard': container.innerHTML = this.state.user.isAdmin ? this.renderAdminDashboardView() : this.renderMatchesView(); break;
                    case 'admin-matches': container.innerHTML = this.state.user.isAdmin ? this.renderAdminMatchesView() : this.renderMatchesView(); break;
                    case 'admin-match-edit': container.innerHTML = this.state.user.isAdmin ? this.renderAdminMatchEditView(this.state.params.matchId) : this.renderMatchesView(); break;
                    case 'admin-players': container.innerHTML = this.state.user.isAdmin ? this.renderAdminPlayersView() : this.renderMatchesView(); break;
                    case 'admin-player-detail': container.innerHTML = this.state.user.isAdmin ? this.renderAdminPlayerDetailView(this.state.params.playerId) : this.renderMatchesView(); break;

                    default: container.innerHTML = this.renderMatchesView();
                }
            }

            renderHeader() {
                const headerNav = document.getElementById('header-nav');
                const headerUser = document.getElementById('header-user-area');
                const mobileNav = document.getElementById('mobile-nav');
                const u = this.state.user;
                const v = this.state.currentView;

                headerNav.innerHTML = `
                    <button onclick="app.navigateTo('matches')" class="transition py-2 border-b-2 ${v === 'matches' ? 'text-white border-goalred' : 'text-zinc-400 border-transparent hover:text-white'}">Explorer</button>
                    ${u.isAuthenticated ? `<button onclick="app.navigateTo('messages')" class="transition py-2 border-b-2 ${v === 'messages' || v === 'game-chat' ? 'text-white border-goalred' : 'text-zinc-400 border-transparent hover:text-white'}">Messages</button>` : ''}
                    ${u.isAdmin ? `<button onclick="app.navigateTo('admin-dashboard')" class="transition py-2 border-b-2 text-goalred font-bold ${v.startsWith('admin') ? 'border-goalred' : 'border-transparent'}"><i class="fa-solid fa-shield-halved"></i> Admin Sécurisé</button>` : ''}
                `;

                if(u.isAuthenticated) {
                    headerUser.innerHTML = `
                        <div class="flex items-center gap-3">
                            <button onclick="app.navigateTo('profile')" class="flex items-center gap-2.5 bg-goalCard hover:bg-goalCardHover border border-goalBorder px-3.5 py-1.5 rounded-full transition group">
                                <img src="${u.avatar}" class="w-8 h-8 rounded-full object-cover border border-goalred">
                                <span class="text-xs font-bold text-white group-hover:text-goalred transition hidden sm:inline">${u.firstName}</span>
                                <span class="text-[10px] text-goalred font-extrabold bg-goalred/10 px-2 py-0.5 rounded-md ml-1">${u.credits.toLocaleString()} F</span>
                            </button>
                        </div>
                    `;
                    mobileNav.innerHTML = `
                        <button onclick="app.navigateTo('matches')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'matches' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-compass text-base mb-1"></i>Explorer</button>
                        <button onclick="app.navigateTo('messages')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'messages' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-comments text-base mb-1"></i>Messages</button>
                        ${u.isAdmin ? `<button onclick="app.navigateTo('admin-dashboard')" class="flex flex-col items-center text-[10px] font-semibold text-goalred"><i class="fa-solid fa-shield-halved text-base mb-1"></i>Admin</button>` : ''}
                        <button onclick="app.navigateTo('profile')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'profile' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-user text-base mb-1"></i>Profil</button>
                    `;
                } else {
                    headerUser.innerHTML = `
                        <div class="flex items-center gap-3">
                            <button onclick="app.openAuthModal('login')" class="text-xs font-bold text-zinc-300 hover:text-white px-3 py-2">Connexion</button>
                            <button onclick="app.openAuthModal('register')" class="text-xs font-bold bg-goalred hover:bg-red-700 text-white px-4 py-2.5 rounded-xl transition shadow-lg shadow-goalred/20">Rejoindre</button>
                        </div>
                    `;
                    mobileNav.innerHTML = `
                        <button onclick="app.navigateTo('matches')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'matches' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-compass text-base mb-1"></i>Explorer</button>
                        <button onclick="app.openAuthModal('login')" class="flex flex-col items-center text-[10px] font-semibold text-zinc-400"><i class="fa-solid fa-user text-base mb-1"></i>Connexion</button>
                    `;
                }
            }

            renderMatchesView() {
                return `
                    <div class="space-y-8">
                        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                            <div>
                                <div class="flex items-center gap-2 text-xs font-bold text-goalred uppercase tracking-wider mb-1">
                                    <i class="fa-solid fa-location-dot"></i> <span>Dakar, Sénégal</span>
                                </div>
                                <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Matchs à venir</h1>
                            </div>
                            <div class="text-xs text-zinc-400 bg-goalCard border border-goalBorder px-3.5 py-2 rounded-xl">
                                ⚽ Terrains synthétiques partenaires
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-5">
                            ${this.state.matches.map(m => {
                                if(m.status === 'Annulé') return '';
                                return `
                                    <div onclick="app.navigateTo('match-detail', { matchId: '${m.id}' })" class="bg-goalCard border border-goalBorder hover:border-zinc-700 rounded-3xl p-6 cursor-pointer transition group shadow-lg">
                                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                                            <div class="flex items-start gap-4">
                                                <div class="bg-[#18181d] border border-goalBorder px-4 py-3 rounded-2xl text-center shrink-0">
                                                    <span class="text-[10px] text-zinc-400 block uppercase font-bold">Date</span>
                                                    <span class="text-sm font-black text-white">${m.dateRaw.split('-').reverse().join('/')}</span>
                                                </div>
                                                <div class="space-y-1">
                                                    <div class="flex items-center gap-2">
                                                        <span class="bg-goalred text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-md">${m.format}</span>
                                                        <span class="text-xs text-zinc-400 font-semibold">• ${m.level}</span>
                                                    </div>
                                                    <h3 class="text-xl font-bold text-white group-hover:text-goalred transition">${m.title}</h3>
                                                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-zinc-400 pt-1">
                                                        <span><i class="fa-regular fa-clock text-goalred mr-1"></i> ${m.time} (${m.duration})</span>
                                                        <span><i class="fa-solid fa-location-dot text-goalred mr-1"></i> ${m.location}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-xl font-black text-white block">${m.price.toLocaleString()} FCFA</span>
                                                <span class="text-xs font-bold bg-white text-black px-4 py-2 rounded-xl inline-block mt-2 group-hover:bg-goalred group-hover:text-white transition">Voir match</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            renderMatchDetailView(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                if(!m) return `<div class="p-12 text-center text-zinc-400">Match introuvable.</div>`;
                const isAuth = this.state.user.isAuthenticated;
                const isBooked = isAuth && m.registeredUsers.includes(this.state.user.id);

                return `
                    <div class="space-y-6">
                        <button onclick="app.navigateTo('matches')" class="text-xs font-semibold text-zinc-400 hover:text-white flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Retour</button>
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                            <h1 class="text-3xl font-black text-white">${m.title}</h1>
                            <p class="text-xs text-zinc-300 leading-relaxed">${m.description}</p>
                            <div class="flex gap-4">
                                <button onclick="app.navigateTo('game-chat', { matchId: '${m.id}' })" class="bg-zinc-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs"><i class="fa-solid fa-comments text-goalred"></i> Ouvrir le Chat Live</button>
                            </div>
                            <div class="pt-4 border-t border-goalBorder">
                                ${!isAuth ? 
                                    `<button onclick="app.openAuthModal('login')" class="w-full bg-goalred text-white font-bold py-4 rounded-xl text-sm shadow-xl">Connecte-toi pour rejoindre ce match</button>` :
                                    (isBooked ? 
                                        `<div class="text-green-400 font-bold text-xs"><i class="fa-solid fa-circle-check"></i> Tu es inscrit à ce match !</div>` :
                                        `<button onclick="app.bookMatch('${m.id}')" class="w-full bg-goalred text-white font-bold py-4 rounded-xl text-sm shadow-xl">Rejoindre le match (${m.price.toLocaleString()} FCFA)</button>`
                                    )
                                }
                            </div>
                        </div>
                    </div>
                `;
            }

            bookMatch(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                if(m && !m.registeredUsers.includes(this.state.user.id)) {
                    m.registeredUsers.push(this.state.user.id);
                    m.currentPlayers += 1;
                    if(!m.welcomeMessages) m.welcomeMessages = {};
                    m.welcomeMessages[this.state.user.id] = `👋 Salut ${this.state.user.firstName} ! Ta place pour "${m.title}" est confirmée.`;
                    alert("Place réservée avec succès !");
                    this.navigateTo('match-detail', { matchId });
                }
            }

            renderGameChatView(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                return `
                    <div class="max-w-2xl mx-auto space-y-4">
                        <button onclick="app.navigateTo('match-detail', { matchId: '${m.id}' })" class="text-xs text-zinc-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Retour au match</button>
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 shadow-2xl space-y-4">
                            <h2 class="font-black text-white text-base">Chat Live - ${m.title}</h2>
                            <div class="bg-[#18181d] border border-goalBorder rounded-2xl p-4 space-y-3 h-80 overflow-y-auto">
                                ${m.messages.length ? m.messages.map(msg => `<div class="text-xs"><strong class="text-white">${msg.userName}:</strong> <span class="text-zinc-300">${msg.text}</span></div>`).join('') : '<p class="text-xs text-zinc-500 text-center py-16">Aucun message.</p>'}
                            </div>
                            ${this.state.user.isAuthenticated ? `
                                <form onsubmit="app.sendMessage(event, '${m.id}')" class="flex gap-2">
                                    <input type="text" id="chat-txt" placeholder="Écrire un message..." required class="flex-grow bg-[#18181d] border border-goalBorder rounded-xl p-3 text-xs text-white">
                                    <button type="submit" class="bg-goalred text-white font-bold px-5 py-3 rounded-xl text-xs">Envoyer</button>
                                </form>
                            ` : `<p class="text-xs text-zinc-500 text-center">Connecte-toi pour participer au chat.</p>`}
                        </div>
                    </div>
                `;
            }

            sendMessage(e, matchId) {
                e.preventDefault();
                const txt = document.getElementById('chat-txt').value;
                const m = this.state.matches.find(item => item.id === matchId);
                if(m && txt) {
                    m.messages.push({ userName: this.state.user.firstName, text: txt, time: "Maintenant" });
                    document.getElementById('chat-txt').value = "";
                    this.navigateTo('game-chat', { matchId });
                }
            }

            renderMessagesView() {
                const u = this.state.user;
                const userMatches = this.state.matches.filter(m => m.registeredUsers.includes(u.id));
                return `
                    <div class="space-y-6">
                        <h1 class="text-3xl font-black text-white">Mes Messages & Notifications</h1>
                        <div class="space-y-4">
                            ${userMatches.length ? userMatches.map(m => `
                                <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 shadow-xl space-y-3">
                                    <h3 class="font-bold text-white text-sm">${m.title}</h3>
                                    <p class="text-xs text-zinc-300">${m.welcomeMessages[u.id] || "Rappel de match."}</p>
                                    <button onclick="app.navigateTo('game-chat', { matchId: '${m.id}' })" class="bg-goalred text-white font-bold px-4 py-2 rounded-xl text-xs">Ouvrir le Chat</button>
                                </div>
                            `).join('') : `<p class="text-xs text-zinc-500 text-center py-12">Aucun message pour le moment.</p>`}
                        </div>
                    </div>
                `;
            }

            renderProfileView() {
                const u = this.state.user;
                return `
                    <div class="space-y-6 max-w-xl mx-auto bg-goalCard border border-goalBorder p-8 rounded-3xl shadow-2xl">
                        <div class="flex justify-between items-center">
                            <h1 class="text-2xl font-black text-white">Mon Profil</h1>
                            <button onclick="app.logout()" class="text-xs font-bold text-red-400 bg-red-500/10 px-4 py-2 rounded-xl">Se déconnecter</button>
                        </div>
                        <div class="space-y-3 text-xs">
                            <p class="text-zinc-300"><strong>Nom :</strong> ${u.firstName} ${u.lastName}</p>
                            <p class="text-zinc-300"><strong>Email :</strong> ${u.email}</p>
                            <p class="text-zinc-300"><strong>Crédits :</strong> ${u.credits.toLocaleString()} FCFA</p>
                        </div>
                    </div>
                `;
            }

            // --- ESPACE ADMIN WEB RÉEL ET COMPLET ---
            renderAdminDashboardView() {
                return `
                    <div class="space-y-8">
                        <div>
                            <span class="text-xs text-goalred font-bold uppercase tracking-wider"><i class="fa-solid fa-shield-halved"></i> Espace Fondateur • Sécurisé</span>
                            <h1 class="text-3xl font-black text-white mt-1">Dashboard Admin Web</h1>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div onclick="app.navigateTo('admin-matches')" class="bg-goalCard border border-goalBorder hover:border-goalred rounded-3xl p-6 cursor-pointer transition group shadow-xl">
                                <div class="w-12 h-12 rounded-2xl bg-goalred/10 flex items-center justify-center text-goalred text-xl mb-4 group-hover:scale-110 transition"><i class="fa-solid fa-futbol"></i></div>
                                <h3 class="text-xl font-bold text-white mb-2">Section Matchs</h3>
                                <p class="text-xs text-zinc-400 leading-relaxed">Créer des matchs, filtrer par date, annuler des sessions, modifier les détails et gérer la feuille de match.</p>
                            </div>
                            <div onclick="app.navigateTo('admin-players')" class="bg-goalCard border border-goalBorder hover:border-goalred rounded-3xl p-6 cursor-pointer transition group shadow-xl">
                                <div class="w-12 h-12 rounded-2xl bg-goalred/10 flex items-center justify-center text-goalred text-xl mb-4 group-hover:scale-110 transition"><i class="fa-solid fa-users"></i></div>
                                <h3 class="text-xl font-bold text-white mb-2">Section Joueurs</h3>
                                <p class="text-xs text-zinc-400 leading-relaxed">Rechercher des utilisateurs par e-mail, consulter leur profil, ajouter ou retirer des crédits de leur portefeuille.</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderAdminMatchesView() {
                const selectedDate = this.state.params.filterDate || "";
                const filtered = selectedDate ? this.state.matches.filter(m => m.dateRaw === selectedDate) : this.state.matches;

                return `
                    <div class="space-y-6">
                        <div class="flex items-center justify-between pb-4 border-b border-goalBorder">
                            <button onclick="app.navigateTo('admin-dashboard')" class="text-xs font-semibold text-zinc-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Retour Dashboard</button>
                            <button onclick="app.openCreateMatchModal()" class="bg-goalred hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-lg"><i class="fa-solid fa-plus"></i> Nouveau match</button>
                        </div>

                        <div class="bg-goalCard border border-goalBorder rounded-2xl p-4 flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <label class="text-xs text-zinc-400 font-bold"><i class="fa-solid fa-filter text-goalred mr-1"></i> Filtrer par date :</label>
                                <input type="date" value="${selectedDate}" onchange="app.filterMatches(this.value)" class="bg-[#18181d] border border-goalBorder rounded-xl p-2.5 text-xs text-white">
                            </div>
                            ${selectedDate ? `<button onclick="app.navigateTo('admin-matches')" class="text-xs text-goalred font-semibold">Réinitialiser</button>` : ''}
                        </div>

                        <div class="space-y-3">
                            ${filtered.map(m => `
                                <div class="bg-goalCard border border-goalBorder rounded-2xl p-5 flex justify-between items-center">
                                    <div>
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-xs font-bold text-goalred">${m.format}</span>
                                            <span class="text-xs text-zinc-400">${m.dateFull} (${m.time})</span>
                                            <span class="text-[10px] px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 font-semibold">${m.status}</span>
                                        </div>
                                        <h4 class="font-bold text-white text-sm">${m.title} —${m.location}</h4>
                                        <span class="text-xs text-zinc-400">Inscrits : <strong>${m.currentPlayers} /${m.maxPlayers}</strong></span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="app.navigateTo('admin-match-edit', { matchId: '${m.id}' })" class="bg-goalred text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md"><i class="fa-solid fa-pen"></i> Éditer</button>
                                        <button onclick="app.deleteMatch('${m.id}')" class="bg-red-500/10 text-red-400 text-xs font-bold px-3 py-2.5 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            filterMatches(val) { this.navigateTo('admin-matches', { filterDate: val }); }

            renderAdminMatchEditView(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                if(!m) return `<div class="p-12 text-center text-zinc-400">Match introuvable.</div>`;

                return `
                    <div class="space-y-6 max-w-2xl mx-auto">
                        <button onclick="app.navigateTo('admin-matches')" class="text-xs text-zinc-400"><i class="fa-solid fa-arrow-left"></i> Retour aux matchs</button>
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 sm:p-8 shadow-2xl">
                            <h2 class="text-xl font-black text-white mb-6">Éditer le match</h2>
                            <form onsubmit="app.saveMatchEdits(event, '${m.id}')" class="space-y-4 text-xs">
                                <div><label class="block text-zinc-400 mb-1">Titre</label><input type="text" id="ed-title" value="${m.title}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div><label class="block text-zinc-400 mb-1">Date (YYYY-MM-DD)</label><input type="date" id="ed-dateraw" value="${m.dateRaw}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                    <div><label class="block text-zinc-400 mb-1">Heure</label><input type="text" id="ed-time" value="${m.time}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div><label class="block text-zinc-400 mb-1">Prix (FCFA)</label><input type="number" id="ed-price" value="${m.price}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                    <div><label class="block text-zinc-400 mb-1">Statut</label>
                                        <select id="ed-status" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white">
                                            <option value="Ouvert" ${m.status==='Ouvert'?'selected':''}>Ouvert</option>
                                            <option value="Annulé" ${m.status==='Annulé'?'selected':''}>Annulé</option>
                                        </select>
                                    </div>
                                </div>
                                <div><label class="block text-zinc-400 mb-1">Lieu</label><input type="text" id="ed-loc" value="${m.location}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                <button type="submit" class="w-full bg-goalred text-white font-bold py-3.5 rounded-xl shadow-lg mt-2">Enregistrer</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            saveMatchEdits(e, matchId) {
                e.preventDefault();
                const m = this.state.matches.find(item => item.id === matchId);
                if(m) {
                    m.title = document.getElementById('ed-title').value;
                    m.dateRaw = document.getElementById('ed-dateraw').value;
                    m.time = document.getElementById('ed-time').value;
                    m.price = parseInt(document.getElementById('ed-price').value);
                    m.status = document.getElementById('ed-status').value;
                    m.location = document.getElementById('ed-loc').value;
                    alert("Match mis à jour avec succès !");
                    this.navigateTo('admin-matches');
                }
            }

            deleteMatch(matchId) {
                if(confirm("Supprimer ce match ?")) {
                    this.state.matches = this.state.matches.filter(m => m.id !== matchId);
                    this.navigateTo('admin-matches');
                }
            }

            openCreateMatchModal() {
                const modal = document.getElementById('system-modal');
                const content = document.getElementById('modal-content');
                modal.classList.remove('hidden');

                content.innerHTML = `
                    <h3 class="text-xl font-black text-white mb-4">Créer un nouveau match</h3>
                    <form onsubmit="app.createMatchSubmit(event)" class="space-y-3 text-xs">
                        <div><label class="block text-zinc-400 mb-1">Titre</label><input type="text" id="cr-title" required placeholder="GOALUP NIGHT" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="block text-zinc-400 mb-1">Date</label><input type="date" id="cr-date" required value="2026-10-15" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                            <div><label class="block text-zinc-400 mb-1">Heure</label><input type="text" id="cr-time" required value="21:00" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                        </div>
                        <div><label class="block text-zinc-400 mb-1">Lieu</label><input type="text" id="cr-loc" required placeholder="Terrain Almadies" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div><label class="block text-zinc-400 mb-1">Max Joueurs</label><input type="number" id="cr-max" required value="16" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                            <div><label class="block text-zinc-400 mb-1">Prix (FCFA)</label><input type="number" id="cr-price" required value="3000" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                        </div>
                        <button type="submit" class="w-full bg-goalred text-white font-bold py-3.5 rounded-xl shadow-lg mt-2">Publier le match</button>
                    </form>
                `;
            }

            createMatchSubmit(e) {
                e.preventDefault();
                const newM = {
                    id: "m_" + Date.now(),
                    title: document.getElementById('cr-title').value,
                    dateRaw: document.getElementById('cr-date').value,
                    dateFull: "Match Dakar",
                    time: document.getElementById('cr-time').value,
                    duration: "1h30",
                    location: document.getElementById('cr-loc').value,
                    address: "Dakar",
                    format: "7v7",
                    level: "Tous niveaux",
                    maxPlayers: parseInt(document.getElementById('cr-max').value),
                    minPlayers: 10,
                    currentPlayers: 0,
                    price: parseInt(document.getElementById('cr-price').value),
                    status: "Ouvert",
                    description: "Match officiel.",
                    registeredUsers: [],
                    messages: [],
                    welcomeMessages: {}
                };
                this.state.matches.push(newM);
                this.closeModal();
                alert("Match créé avec succès !");
                this.navigateTo('admin-matches');
            }

            renderAdminPlayersView() {
                const search = (this.state.params.searchEmail || "").toLowerCase();
                const players = Object.values(this.state.playersDirectory);
                const filtered = search ? players.filter(p => p.email.toLowerCase().includes(search)) : players;

                return `
                    <div class="space-y-6">
                        <div class="flex items-center justify-between pb-4 border-b border-goalBorder">
                            <button onclick="app.navigateTo('admin-dashboard')" class="text-xs font-semibold text-zinc-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Retour Dashboard</button>
                            <h2 class="text-xl font-black text-white">Annuaire des Joueurs</h2>
                        </div>

                        <div class="bg-goalCard border border-goalBorder rounded-2xl p-4 flex items-center gap-3">
                            <i class="fa-solid fa-magnifying-glass text-zinc-400"></i>
                            <input type="text" placeholder="Rechercher par email..." value="${search}" oninput="app.searchPlayer(this.value)" class="w-full bg-transparent text-xs text-white outline-none">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${filtered.map(p => `
                                <div onclick="app.navigateTo('admin-player-detail', { playerId: '${p.id}' })" class="bg-goalCard border border-goalBorder hover:border-goalred rounded-2xl p-5 cursor-pointer flex items-center justify-between transition">
                                    <div class="flex items-center gap-4">
                                        <img src="${p.avatar}" class="w-12 h-12 rounded-full object-cover">
                                        <div>
                                            <h4 class="font-bold text-white text-sm">${p.firstName}${p.lastName}</h4>
                                            <span class="text-xs text-zinc-400 block">${p.email}</span>
                                            <span class="text-[10px] text-goalred font-bold">Crédits : ${p.credits.toLocaleString()} F</span>
                                        </div>
                                    </div>
                                    <span class="text-xs bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded-xl">Gérer</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            searchPlayer(val) { this.navigateTo('admin-players', { searchEmail: val }); }

            renderAdminPlayerDetailView(playerId) {
                const p = this.state.playersDirectory[playerId];
                if(!p) return `<div class="p-12 text-center text-zinc-400">Joueur introuvable.</div>`;

                return `
                    <div class="space-y-6 max-w-xl mx-auto">
                        <button onclick="app.navigateTo('admin-players')" class="text-xs text-zinc-400"><i class="fa-solid fa-arrow-left"></i> Retour aux joueurs</button>
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                            <div class="flex items-center gap-4">
                                <img src="${p.avatar}" class="w-16 h-16 rounded-full object-cover border-2 border-goalred">
                                <div>
                                    <h2 class="text-xl font-black text-white">${p.firstName} ${p.lastName}</h2>
                                    <span class="text-xs text-zinc-400 block">${p.email} • ${p.phone}</span>
                                </div>
                            </div>
                            <div class="bg-[#18181d] border border-goalBorder p-4 rounded-2xl flex justify-between items-center">
                                <div>
                                    <span class="text-[10px] text-zinc-400 block uppercase font-bold">Portefeuille</span>
                                    <span class="text-xl font-black text-white">${p.credits.toLocaleString()} FCFA</span>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="app.modifyCredits('${p.id}', 5000)" class="bg-green-500/10 text-green-400 text-xs font-bold px-3 py-2 rounded-xl">+ 5k</button>
                                    <button onclick="app.modifyCredits('${p.id}', -5000)" class="bg-red-500/10 text-red-400 text-xs font-bold px-3 py-2 rounded-xl">- 5k</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            modifyCredits(playerId, amount) {
                const p = this.state.playersDirectory[playerId];
                if(p) {
                    p.credits = Math.max(0, p.credits + amount);
                    this.navigateTo('admin-player-detail', { playerId });
                }
            }

            renderLoginPrompt() {
                return `<div class="text-center py-16 bg-goalCard border border-goalBorder rounded-3xl p-8"><h2 class="text-xl font-black text-white mb-3">Connexion Requise</h2><button onclick="app.openAuthModal('login')" class="bg-goalred text-white font-bold px-6 py-3 rounded-xl text-xs">Se connecter</button></div>`;
            }

            openAuthModal(mode) {
                const modal = document.getElementById('system-modal');
                const content = document.getElementById('modal-content');
                modal.classList.remove('hidden');

                content.innerHTML = `
                    <h3 class="text-xl font-black text-white mb-4">Connexion</h3>
                    <form onsubmit="app.handleAuth(event)" class="space-y-3 text-xs">
                        <input type="email" id="auth-email" placeholder="Votre email" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white">
                        <input type="password" id="auth-pwd" placeholder="Votre mot de passe" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white">
                        <button type="submit" class="w-full bg-goalred text-white font-bold py-3.5 rounded-xl text-sm shadow-lg mt-2">Valider</button>
                    </form>
                `;
            }

            handleAuth(e) {
                e.preventDefault();
                const email = document.getElementById('auth-email').value.trim().toLowerCase();
                const pwd = document.getElementById('auth-pwd').value;

                // Vérification stricte : Omar + ton nouveau mot de passe
                const isAdmin = (email === "omar.goalup@gmail.com" && pwd === "47749669");

                if(email === "omar.goalup@gmail.com" && pwd !== "47749669") {
                    alert("Mot de passe incorrect.");
                    return;
                }

                this.state.user = {
                    id: "usr_" + Date.now(),
                    firstName: isAdmin ? "Omar" : "Membre",
                    lastName: "GoalUp",
                    email: email,
                    phone: "+221 77 000 00 00",
                    credits: 10000,
                    avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
                    isAdmin: isAdmin,
                    isAuthenticated: true
                };

                this.closeModal();
                alert(isAdmin ? "Bienvenue dans l'espace Administrateur !" : "Connexion réussie !");
                this.navigateTo('matches');
            }

            logout() {
                this.state.user = { id: null, isAuthenticated: false, isAdmin: false };
                this.navigateTo('matches');
            }

            closeModal() { document.getElementById('system-modal').classList.add('hidden'); }
        }

        const app = new GoalUpApp();
    </script>
</body>
</html>
