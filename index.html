<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOALUP — Application Officielle Dakar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        goalred: '#E50914',
                        goalDark: '#060608',
                        goalCard: '#111115',
                        goalCardHover: '#18181d',
                        goalBorder: '#22222b',
                        waveBlue: '#1EBBEE'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #060608; color: #f4f4f5; min-height: 100vh; overflow-x: hidden; }
        input, select, textarea { color-scheme: dark; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-goalred selection:text-white">

    <header class="sticky top-0 z-50 bg-[#060608]/95 backdrop-blur-md border-b border-goalBorder">
        <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer group" onclick="app.navigateTo('matches')">
                <span class="text-xl font-black tracking-wider text-white">GOAL<span class="text-goalred">UP</span></span>
                <span class="text-[10px] uppercase font-bold tracking-widest text-zinc-500 border-l border-goalBorder pl-3 hidden sm:inline-block">Dakar</span>
            </div>
            <nav id="header-nav" class="hidden md:flex items-center space-x-8 text-sm font-semibold"></nav>
            <div id="header-user-area"></div>
        </div>
    </header>

    <div id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[#111115] border-t border-goalBorder flex justify-around py-3 px-2"></div>

    <main id="app-container" class="flex-grow pb-32 md:pb-16 pt-6 px-4 max-w-6xl mx-auto w-full"></main>

    <div id="system-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-goalCard border border-goalBorder rounded-3xl w-full max-w-md p-6 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <button onclick="app.closeModal()" class="absolute top-5 right-5 text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="border-t border-goalBorder bg-[#060608] py-8 px-4 text-center text-xs text-zinc-500 mb-16 md:mb-0">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <span class="font-bold tracking-wider text-zinc-400">GOALUP SÉNÉGAL S.A.</span>
            <p>« Chaque match compte. » — Dakar, Sénégal</p>
            <span class="text-zinc-600">&copy; 2026 Tous droits réservés</span>
        </div>
    </footer>

    <script>
        class GoalUpApp {
            constructor() {
                try {
                    // Vérification et nettoyage automatique si le cache mobile est corrompu
                    const savedUser = localStorage.getItem('goalup_current_user');
                    const savedMatches = localStorage.getItem('goalup_matches');
                    const savedDb = localStorage.getItem('goalup_users_db');

                    this.state = {
                        currentView: 'matches',
                        params: {},
                        user: savedUser ? JSON.parse(savedUser) : {
                            id: null, firstName: "", lastName: "", email: "", phone: "", credits: 0, avatar: "", isAdmin: false, isAuthenticated: false
                        },
                        matches: savedMatches ? JSON.parse(savedMatches) : [],
                        usersDatabase: savedDb ? JSON.parse(savedDb) : {
                            "omar.goalup@gmail.com": {
                                id: "usr_admin", firstName: "Omar", lastName: "GoalUp", email: "omar.goalup@gmail.com", phone: "+221 77 823 44 55", password: "47749669", credits: 50000, avatar: "", isAdmin: true
                            }
                        }
                    };
                } catch(err) {
                    console.error("Erreur critique de chargement du stockage :", err);
                    localStorage.clear();
                    this.state = {
                        currentView: 'matches',
                        params: {},
                        user: { id: null, firstName: "", lastName: "", email: "", phone: "", credits: 0, avatar: "", isAdmin: false, isAuthenticated: false },
                        matches: [],
                        usersDatabase: {
                            "omar.goalup@gmail.com": {
                                id: "usr_admin", firstName: "Omar", lastName: "GoalUp", email: "omar.goalup@gmail.com", phone: "+221 77 823 44 55", password: "47749669", credits: 50000, avatar: "", isAdmin: true
                            }
                        }
                    };
                }

                const urlParams = new URLSearchParams(window.location.search);
                if(urlParams.get('payment') === 'success' && urlParams.get('matchId')) {
                    const matchId = urlParams.get('matchId');
                    window.history.replaceState({}, document.title, window.location.pathname);
                    setTimeout(() => {
                        if(this.state.user.isAuthenticated) {
                            this.confirmBooking(matchId);
                        }
                    }, 500);
                }

                this.navigateTo('matches');
            }

            saveToStorage() {
                localStorage.setItem('goalup_current_user', JSON.stringify(this.state.user));
                localStorage.setItem('goalup_matches', JSON.stringify(this.state.matches));
                localStorage.setItem('goalup_users_db', JSON.stringify(this.state.usersDatabase));
            }

            navigateTo(view, params = {}) {
                this.state.currentView = view;
                this.state.params = params;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            }

            render() {
                this.renderHeader();
                const container = document.getElementById('app-container');

                switch(this.state.currentView) {
                    case 'matches': container.innerHTML = this.renderMatchesView(); break;
                    case 'match-detail': container.innerHTML = this.renderMatchDetailView(this.state.params.matchId); break;
                    case 'messages': container.innerHTML = this.state.user.isAuthenticated ? this.renderMessagesView() : this.renderLoginPrompt(); break;
                    case 'game-chat': container.innerHTML = this.renderGameChatView(this.state.params.matchId); break;
                    case 'profile': container.innerHTML = this.state.user.isAuthenticated ? this.renderProfileView() : this.renderLoginPrompt(); break;
                    
                    case 'admin-dashboard': container.innerHTML = this.state.user.isAdmin ? this.renderAdminDashboardView() : this.renderMatchesView(); break;
                    case 'admin-matches': container.innerHTML = this.state.user.isAdmin ? this.renderAdminMatchesView() : this.renderMatchesView(); break;
                    case 'admin-match-edit': container.innerHTML = this.state.user.isAdmin ? this.renderAdminMatchEditView(this.state.params.matchId) : this.renderMatchesView(); break;
                    case 'admin-players': container.innerHTML = this.state.user.isAdmin ? this.renderAdminPlayersView() : this.renderMatchesView(); break;
                    case 'admin-player-edit': container.innerHTML = this.state.user.isAdmin ? this.renderAdminPlayerEditView(this.state.params.playerId) : this.renderMatchesView(); break;

                    default: container.innerHTML = this.renderMatchesView();
                }
            }

            renderAvatar(user, sizeClass = "w-8 h-8", textClass = "text-xs") {
                if (user && user.avatar && user.avatar.trim() !== "") {
                    return `<img src="${user.avatar}" class="${sizeClass} rounded-full object-cover border border-goalred">`;
                }
                const initial = user && user.firstName ? user.firstName.charAt(0).toUpperCase() : "?";
                return `<div class="${sizeClass} rounded-full bg-goalred/20 border border-goalred flex items-center justify-center ${textClass} font-bold text-white shrink-0">${initial}</div>`;
            }

            renderHeader() {
                const headerNav = document.getElementById('header-nav');
                const headerUser = document.getElementById('header-user-area');
                const mobileNav = document.getElementById('mobile-nav');
                const u = this.state.user;
                const v = this.state.currentView;

                headerNav.innerHTML = `
                    <button onclick="app.navigateTo('matches')" class="transition py-2 border-b-2 ${v === 'matches' ? 'text-white border-goalred' : 'text-zinc-400 border-transparent hover:text-white'}">Explorer</button>
                    ${u.isAuthenticated ? `<button onclick="app.navigateTo('messages')" class="transition py-2 border-b-2 ${v === 'messages' || v === 'game-chat' ? 'text-white border-goalred' : 'text-zinc-400 border-transparent hover:text-white'}">Messages</button>` : ''}
                    ${u.isAdmin ? `<button onclick="app.navigateTo('admin-dashboard')" class="transition py-2 border-b-2 text-goalred font-bold ${v.startsWith('admin') ? 'border-goalred' : 'border-transparent'}"><i class="fa-solid fa-shield-halved"></i> Admin</button>` : ''}
                `;

                if(u.isAuthenticated) {
                    headerUser.innerHTML = `
                        <div class="flex items-center gap-2">
                            <button onclick="app.navigateTo('profile')" class="flex items-center gap-2 bg-goalCard hover:bg-goalCardHover border border-goalBorder px-3 py-1.5 rounded-full transition group">
                                ${this.renderAvatar(u, "w-7 h-7", "text-xs")}
                                <span class="text-xs font-bold text-white group-hover:text-goalred transition truncate max-w-[80px] sm:max-w-none">${u.firstName}</span>
                                <span class="text-[10px] ${u.isAdmin ? 'text-goalred font-black' : 'text-zinc-400'} bg-goalred/10 px-1.5 py-0.5 rounded-md ml-0.5 hidden sm:inline">${u.isAdmin ? 'ADMIN' : u.credits.toLocaleString() + ' F'}</span>
                            </button>
                        </div>
                    `;
                    mobileNav.innerHTML = `
                        <button onclick="app.navigateTo('matches')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'matches' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-compass text-base mb-1"></i>Explorer</button>
                        <button onclick="app.navigateTo('messages')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'messages' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-comments text-base mb-1"></i>Messages</button>
                        ${u.isAdmin ? `<button onclick="app.navigateTo('admin-dashboard')" class="flex flex-col items-center text-[10px] font-semibold text-goalred"><i class="fa-solid fa-shield-halved text-base mb-1"></i>Admin</button>` : ''}
                        <button onclick="app.navigateTo('profile')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'profile' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-user text-base mb-1"></i>Profil</button>
                    `;
                } else {
                    headerUser.innerHTML = `
                        <div class="flex items-center gap-2">
                            <button onclick="app.openAuthModal('login')" class="text-xs font-bold text-zinc-300 hover:text-white px-2 py-1.5">Connexion</button>
                            <button onclick="app.openAuthModal('register')" class="text-xs font-bold bg-goalred hover:bg-red-700 text-white px-3 py-2 rounded-xl transition shadow-lg">Rejoindre</button>
                        </div>
                    `;
                    mobileNav.innerHTML = `
                        <button onclick="app.navigateTo('matches')" class="flex flex-col items-center text-[10px] font-semibold ${v === 'matches' ? 'text-goalred' : 'text-zinc-400'}"><i class="fa-solid fa-compass text-base mb-1"></i>Explorer</button>
                        <button onclick="app.openAuthModal('login')" class="flex flex-col items-center text-[10px] font-semibold text-zinc-400"><i class="fa-solid fa-user text-base mb-1"></i>Connexion</button>
                    `;
                }
            }

            renderMatchesView() {
                if(!this.state.matches || this.state.matches.length === 0) {
                    return `
                        <div class="space-y-8 py-12">
                            <div>
                                <div class="flex items-center gap-2 text-xs font-bold text-goalred uppercase tracking-wider mb-1">
                                    <i class="fa-solid fa-location-dot"></i> <span>Dakar, Sénégal</span>
                                </div>
                                <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Matchs à venir</h1>
                            </div>
                            <div class="bg-goalCard border border-goalBorder rounded-3xl p-8 sm:p-12 text-center space-y-4 shadow-xl">
                                <i class="fa-solid fa-futbol text-4xl text-zinc-600"></i>
                                <h3 class="text-lg font-bold text-white">Aucun match programmé pour le moment</h3>
                                <p class="text-xs text-zinc-400 max-w-sm mx-auto">Reviens un peu plus tard ou connecte-toi en administrateur pour créer et publier de nouvelles sessions à Dakar.</p>
                                ${this.state.user.isAdmin ? `<button onclick="app.navigateTo('admin-matches')" class="bg-goalred text-white font-bold px-6 py-3 rounded-xl text-xs mt-2 inline-block shadow-lg">Créer un match</button>` : ''}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="space-y-8">
                        <div>
                            <div class="flex items-center gap-2 text-xs font-bold text-goalred uppercase tracking-wider mb-1">
                                <i class="fa-solid fa-location-dot"></i> <span>Dakar, Sénégal</span>
                            </div>
                            <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Matchs à venir</h1>
                        </div>

                        <div class="grid grid-cols-1 gap-5">
                            ${this.state.matches.map(m => {
                                if(m.status === 'Annulé') return '';
                                const count = m.registeredUsers ? m.registeredUsers.length : 0;
                                const percent = Math.min(100, Math.round((count / m.maxPlayers) * 100));
                                return `
                                    <div onclick="app.navigateTo('match-detail', { matchId: '${m.id}' })" class="bg-goalCard border border-goalBorder hover:border-zinc-700 rounded-3xl p-5 sm:p-6 cursor-pointer transition group shadow-lg space-y-4">
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div class="flex items-start gap-4">
                                                <div class="bg-[#18181d] border border-goalBorder px-3.5 py-3 rounded-2xl text-center shrink-0">
                                                    <span class="text-[10px] text-zinc-400 block uppercase font-bold">Date</span>
                                                    <span class="text-xs sm:text-sm font-black text-white">${m.dateRaw ? m.dateRaw.split('-').reverse().join('/') : ''}</span>
                                                </div>
                                                <div class="space-y-1">
                                                    <div class="flex items-center gap-2">
                                                        <span class="bg-goalred text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-md">${m.format}</span>
                                                        <span class="text-xs text-zinc-400 font-semibold">• ${m.level}</span>
                                                    </div>
                                                    <h3 class="text-lg sm:text-xl font-bold text-white group-hover:text-goalred transition">${m.title}</h3>
                                                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-zinc-400 pt-1">
                                                        <span><i class="fa-regular fa-clock text-goalred mr-1"></i> ${m.time} (${m.duration})</span>
                                                        <span><i class="fa-solid fa-location-dot text-goalred mr-1"></i> ${m.location}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="flex sm:flex-col justify-between sm:text-right items-center sm:items-end pt-2 sm:pt-0 border-t sm:border-0 border-goalBorder">
                                                <span class="text-lg sm:text-xl font-black text-white">${m.price.toLocaleString()} FCFA</span>
                                                <span class="text-xs font-bold bg-white text-black px-3.5 py-1.5 sm:mt-2 rounded-xl group-hover:bg-goalred group-hover:text-white transition">Voir</span>
                                            </div>
                                        </div>
                                        <div class="space-y-1.5 pt-2 border-t border-goalBorder">
                                            <div class="flex justify-between text-xs font-bold">
                                                <span class="text-zinc-400">Remplissage : <strong class="text-white">${count} / ${m.maxPlayers} joueurs</strong></span>
                                                <span class="${count >= m.maxPlayers ? 'text-red-500' : 'text-goalred'}">${count >= m.maxPlayers ? 'COMPLET' : percent + '%'}</span>
                                            </div>
                                            <div class="w-full h-2 bg-[#18181d] rounded-full overflow-hidden border border-goalBorder">
                                                <div class="h-full bg-goalred transition-all duration-500" style="width: ${percent}%"></div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            renderMatchDetailView(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                if(!m) return `<div class="p-12 text-center text-zinc-400">Match introuvable.</div>`;
                const u = this.state.user;
                const isAuth = u.isAuthenticated;
                const isBooked = isAuth && m.registeredUsers && m.registeredUsers.includes(u.id);
                const count = m.registeredUsers ? m.registeredUsers.length : 0;
                const percent = Math.min(100, Math.round((count / m.maxPlayers) * 100));

                const registeredProfiles = m.registeredUsers ? m.registeredUsers.map(uid => {
                    return Object.values(this.state.usersDatabase).find(usr => usr.id === uid) || { firstName: "Joueur", lastName: "GOALUP", avatar: "" };
                }) : [];

                return `
                    <div class="space-y-6 max-w-3xl mx-auto">
                        <button onclick="app.navigateTo('matches')" class="text-xs font-semibold text-zinc-400 hover:text-white flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Retour</button>
                        
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
                            <div class="space-y-2">
                                <span class="bg-goalred text-white text-[10px] font-extrabold px-3 py-1 rounded-md">${m.format} • ${m.level}</span>
                                <h1 class="text-2xl sm:text-3xl font-black text-white">${m.title}</h1>
                                <p class="text-xs text-zinc-400"><i class="fa-solid fa-location-dot text-goalred mr-1"></i> ${m.location} • <i class="fa-regular fa-clock text-goalred ml-2 mr-1"></i> ${m.dateRaw} à ${m.time}</p>
                            </div>

                            <p class="text-xs text-zinc-300 leading-relaxed">${m.description}</p>

                            <div class="bg-[#18181d] border border-goalBorder p-4 rounded-2xl space-y-2">
                                <div class="flex justify-between text-xs font-bold">
                                    <span class="text-zinc-400">Joueurs inscrits</span>
                                    <span class="text-white">${count} / ${m.maxPlayers} max</span>
                                </div>
                                <div class="w-full h-2.5 bg-black rounded-full overflow-hidden border border-goalBorder">
                                    <div class="h-full bg-goalred" style="width: ${percent}%"></div>
                                </div>
                            </div>

                            <div class="space-y-3">
                                <h3 class="text-sm font-black text-white">Équipe des inscrits (${count}/${m.maxPlayers})</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    ${registeredProfiles.length ? registeredProfiles.map(p => `
                                        <div class="flex items-center gap-3 bg-[#18181d] border border-goalBorder p-3 rounded-2xl">
                                            ${this.renderAvatar(p, "w-8 h-8", "text-xs")}
                                            <span class="text-xs font-bold text-white">${p.firstName} ${p.lastName}</span>
                                        </div>
                                    `).join('') : `<p class="text-xs text-zinc-500 italic py-2">Aucun joueur inscrit pour le moment. Sois le premier !</p>`}
                                </div>
                            </div>

                            <div class="flex gap-3 pt-2">
                                <button onclick="app.navigateTo('game-chat', { matchId: '${m.id}' })" class="bg-zinc-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs"><i class="fa-solid fa-comments text-goalred"></i> Ouvrir le Chat Live</button>
                            </div>

                            <div class="pt-4 border-t border-goalBorder">
                                ${!isAuth ? `
                                    <div class="flex flex-col sm:flex-row gap-3">
                                        <button onclick="app.openAuthModal('login')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3.5 rounded-xl text-xs transition">Se connecter</button>
                                        <button onclick="app.openAuthModal('register')" class="flex-1 bg-goalred hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg">S'inscrire</button>
                                    </div>
                                ` : (isBooked ? `
                                    <div class="space-y-3">
                                        <div class="bg-green-500/10 border border-green-500/30 text-green-400 font-bold text-xs p-4 rounded-2xl flex items-center justify-between">
                                            <span><i class="fa-solid fa-circle-check text-base mr-2"></i> Ta place est confirmée pour ce match !</span>
                                        </div>
                                        <button onclick="app.openQuitMatchModal('${m.id}')" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 rounded-xl text-xs transition border border-red-500/30">
                                            Quitter le match (Politique de remboursement)
                                        </button>
                                    </div>
                                ` : (count >= m.maxPlayers ? `
                                    <div class="text-red-500 font-bold text-xs text-center py-3 bg-red-500/10 rounded-xl">Match complet !</div>
                                ` : `
                                    <div class="space-y-3">
                                        <a href="https://pay.wave.com/m/M_sn_cUn3bNetMY4Y/c/sn/" target="_blank" onclick="app.prepareBooking('${m.id}')" class="w-full bg-[#1EBBEE] hover:bg-sky-400 text-black font-extrabold py-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-2 block text-center">
                                            <i class="fa-solid fa-wallet"></i> Payer ${m.price.toLocaleString()} FCFA avec WAVE
                                        </a>
                                    </div>
                                `))}
                            </div>
                        </div>
                    </div>
                `;
            }

            prepareBooking(matchId) {
                localStorage.setItem('goalup_pending_match', matchId);
            }

            confirmBooking(matchId) {
                const m = this.state.matches.find(item => item.id === matchId);
                const u = this.state.user;

                if(m && !m.registeredUsers.includes(u.id)) {
                    m.registeredUsers.push(u.id);
                    if(!m.welcomeMessages) m.welcomeMessages = {};
                    m.welcomeMessages[u.id] = `👋 Salut ${u.firstName} ! Paiement Wave validé. Ta place pour "${m.title}" est confirmée.`;
                    this.saveToStorage();
                    localStorage.removeItem('goalup_pending_match');
                    alert("Réservation confirmée avec succès !");
                    this.navigateTo('match-detail', { matchId });
                }
            }

            openQuitMatchModal(matchId) {
                const modal = document.getElementById('system-modal');
                const content = document.getElementById('modal-content');
                modal.classList.remove('hidden');

                content.innerHTML = `
                    <div class="space-y-5 text-center">
                        <h3 class="text-xl font-black text-white">Quitter le match</h3>
                        <p class="text-xs text-zinc-300 leading-relaxed">
                            Règles de remboursement de GOALUP :<br>
                            • <strong>> 24h avant</strong> : Remboursement total.<br>
                            • <strong>Entre 15h et 24h</strong> : Remboursement en crédits GOALUP.<br>
                            • <strong>< 15h avant</strong> : Aucun remboursement.
                        </p>
                        <div class="space-y-2 pt-2">
                            <button onclick="app.processQuitMatch('${matchId}', 26)" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-xl text-xs">Simuler annulation > 24h (Total)</button>
                            <button onclick="app.processQuitMatch('${matchId}', 18)" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-xl text-xs">Simuler annulation (Entre 15h et 24h)</button>
                            <button onclick="app.processQuitMatch('${matchId}', 10)" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold py-3 rounded-xl text-xs">Simuler annulation < 15h (Pas de remboursement)</button>
                        </div>
                    </div>
                `;
            }

            processQuitMatch(matchId, hoursBefore) {
                const m = this.state.matches.find(item => item.id === matchId);
                const u = this.state.user;

                m.registeredUsers = m.registeredUsers.filter(uid => uid !== u.id);

                let msg = "";
                if (hoursBefore > 24) {
                    msg = "Match quitté plus de 24h avant : Votre remboursement total a été pris en compte.";
                } else if (hoursBefore >= 15) {
                    u.credits += m.price;
                    msg = `Match quitté entre 15h et 24h avant : ${m.price} FCFA ajoutés en crédits GOALUP sur votre profil !`;
                } else {
                    msg = "Match quitté moins de 15h avant : Aucun remboursement effectué conformément au règlement.";
                }

                if(this.state.usersDatabase[u.email]) {
                    this.state.usersDatabase[u.email].credits = u.credits;
                }

                this.saveToStorage();
                this.closeModal();
                alert(msg);
                this.navigateTo('match-detail', { matchId });
            }

            handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('auth-email').value.trim().toLowerCase();
                const pwd = document.getElementById('auth-pwd').value;
                const dbUser = this.state.usersDatabase[email];

                if (!dbUser || dbUser.password !== pwd) {
                    alert("Erreur : E-mail inconnu ou mot de passe incorrect.");
                    return;
                }

                this.state.user = { ...dbUser, isAuthenticated: true };
                this.saveToStorage();
                this.closeModal();
                alert(dbUser.isAdmin ? "Connexion Fondateur réussie !" : "Connexion réussie !");
                this.navigateTo('matches');
            }

            handleRegister(e) {
                e.preventDefault();
                const fn = document.getElementById('reg-fn').value.trim();
                const ln = document.getElementById('reg-ln').value.trim();
                const email = document.getElementById('reg-email').value.trim().toLowerCase();
                const phone = document.getElementById('reg-phone').value.trim();
                const pwd = document.getElementById('reg-pwd').value;
                const fileInput = document.getElementById('reg-avatar-file');

                if (this.state.usersDatabase[email]) {
                    alert("Cet e-mail est déjà associé à un compte. Veuillez vous connecter.");
                    return;
                }

                const processUser = (avatarBase64 = "") => {
                    const newUser = {
                        id: "usr_" + Date.now(),
                        firstName: fn,
                        lastName: ln,
                        email: email,
                        phone: phone,
                        password: pwd,
                        credits: 0,
                        avatar: avatarBase64,
                        isAdmin: false
                    };

                    this.state.usersDatabase[email] = newUser;
                    this.state.user = { ...newUser, isAuthenticated: true };
                    this.saveToStorage();
                    this.closeModal();
                    alert("Compte créé avec succès !");
                    this.navigateTo('matches');
                };

                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        processUser(uploadEvent.target.result);
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    processUser("");
                }
            }

            deleteMyAccount() {
                const u = this.state.user;
                if(u.isAdmin) {
                    alert("Le compte administrateur principal ne peut pas être supprimé depuis cette interface.");
                    return;
                }
                if(confirm("Attention : Voulez-vous vraiment supprimer définitivement votre compte GOALUP ? Cette action est irréversible.")) {
                    delete this.state.usersDatabase[u.email];
                    this.state.matches.forEach(m => {
                        m.registeredUsers = m.registeredUsers.filter(id => id !== u.id);
                    });
                    this.saveToStorage();
                    this.logout();
                    alert("Votre compte a été supprimé avec succès.");
                }

                                <div class="bg-goalCard border border-goalBorder rounded-2xl p-5 flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        ${this.renderAvatar(p, "w-12 h-12", "text-base")}
                                        <div>
                                            <h4 class="font-bold text-white text-sm">${p.firstName}${p.lastName}</h4>
                                            <span class="text-xs text-zinc-400 block">${p.email} •${p.credits.toLocaleString()} F de crédits</span>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="app.navigateTo('admin-player-edit', { playerId: '${p.id}' })" class="bg-goalred text-white text-xs font-bold px-3.5 py-2.5 rounded-xl"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="app.banPlayer('${p.email}')" class="bg-red-500/10 text-red-400 text-xs font-bold px-3 py-2.5 rounded-xl"><i class="fa-solid fa-ban"></i></button>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-xs text-zinc-500 text-center py-12">Aucun joueur inscrit.</p>'}
                        </div>
                    </div>
                `;
            }

            renderAdminPlayerEditView(playerId) {
                const p = Object.values(this.state.usersDatabase).find(usr => usr.id === playerId);
                if(!p) return `<div class="p-12 text-center text-zinc-400">Joueur introuvable.</div>`;

                return `
                    <div class="space-y-6 max-w-xl mx-auto">
                        <button onclick="app.navigateTo('admin-players')" class="text-xs text-zinc-400"><i class="fa-solid fa-arrow-left"></i> Retour</button>
                        <div class="bg-goalCard border border-goalBorder rounded-3xl p-6 sm:p-8 shadow-2xl">
                            <h2 class="text-xl font-black text-white mb-6">Modifier le joueur ${p.firstName}</h2>
                            <form onsubmit="app.savePlayerAdminEdits(event, '${p.email}')" class="space-y-4 text-xs">
                                <div><label class="block text-zinc-400 mb-1">Prénom</label><input type="text" id="adm-fn" value="${p.firstName}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                <div><label class="block text-zinc-400 mb-1">Nom</label><input type="text" id="adm-ln" value="${p.lastName}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                <div><label class="block text-zinc-400 mb-1">Crédits GOALUP (FCFA)</label><input type="number" id="adm-credits" value="${p.credits}" required class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-3 text-white"></div>
                                <div>
                                    <label class="block text-zinc-400 mb-1">Modifier la photo</label>
                                    <input type="file" id="adm-avatar-file" accept="image/*" class="w-full bg-[#18181d] border border-goalBorder rounded-xl p-2 text-white text-xs file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-goalred file:text-white hover:file:bg-red-700">
                                </div>
                                <button type="submit" class="w-full bg-goalred text-white font-bold py-3.5 rounded-xl shadow-lg mt-2">Enregistrer les modifications</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            savePlayerAdminEdits(e, email) {
                e.preventDefault();
                const p = this.state.usersDatabase[email];
                const fileInput = document.getElementById('adm-avatar-file');

                const applyAdminEdits = (newAvatar = p.avatar) => {
                    p.firstName = document.getElementById('adm-fn').value.trim();
                    p.lastName = document.getElementById('adm-ln').value.trim();
                    p.credits = parseInt(document.getElementById('adm-credits').value);
                    p.avatar = newAvatar;
                    this.saveToStorage();
                    alert("Profil du joueur mis à jour avec succès !");
                    this.navigateTo('admin-players');
                };

                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(uploadEvent) {
                        applyAdminEdits(uploadEvent.target.result);
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                } else {
                    applyAdminEdits(p.avatar);
                }
            }

            banPlayer(email) {
                if(confirm("Supprimer ce joueur ?")) {
                    delete this.state.usersDatabase[email];
                    this.saveToStorage();
                    this.navigateTo('admin-players');
                }
            }

            renderLoginPrompt() {
                return `<div class="text-center py-16 bg-goalCard border border-goalBorder rounded-3xl p-8"><h2 class="text-xl font-black text-white mb-3">Connexion Requise</h2><button onclick="app.openAuthModal('login')" class="bg-goalred text-white font-bold px-6 py-3 rounded-xl text-xs">Se connecter</button></div>`;
            }
        }

        const app = new GoalUpApp();
    </script>
</body>
</html>
